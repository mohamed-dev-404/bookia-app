name: bookia
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  connectivity_plus: ^7.0.0
  dartz: ^0.10.1
  device_preview: ^1.3.1
  dio: ^5.9.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^10.0.0
  flutter_svg: ^2.2.4
  gap: ^3.0.1
  get_it: ^9.2.1
  go_router: ^17.2.0
  logger: ^2.7.0
  lottie: ^3.3.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lotties/

  fonts:
    - family: DMSerif
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
